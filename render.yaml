services:
  # Web Service - Full Stack App
  - type: web
    name: sales-route-collector
    env: node
    region: oregon
    plan: free
    branch: claude/check-011CUvLScv3d6j4vJWwuxs4A
    buildCommand: npm install && cd client && npm install && npm run build && cd ..
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: CLIENT_URL
        sync: false
    healthCheckPath: /api/health
